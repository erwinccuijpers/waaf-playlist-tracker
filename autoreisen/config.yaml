# Autoreisen price watcher configuration.
# Alert when the current price is at least this much below what you paid.
min_savings_eur: 3

site:
  # Search-form parameter names for pickup / return TIME.
  # Verified against the car-hire search form on autoreisen.com (Nov 2026):
  # <select name="hora_inicio"> and <select name="hora_final">, values like "10:00".
  pickup_time_param: "hora_inicio"
  return_time_param: "hora_final"
  time_format: "%H:%M"     # the site's time options are whole hours, e.g. 10:00
  extra_params:
    fin: 1

  # CSS selectors for the real autoreisen.com rates page (verified Nov 2026).
  # Each car is an <article class="car-feature"> with the group+model in
  # <strong class="title"> ("A- Citröen C3 5P") and the EUR total inside
  # the <a class="price"> in the price block. Remove this block to fall back
  # to auto-detection.
  selectors:
    car: "article.car-feature"
    group: "strong.title"
    model: "strong.title"
    price: ".price-block a.price"

# Office codes (ofi_rec = pickup, ofi_dev = return; see README for the full list).
#   2 = Tenerife South (TFS).  ofi_dev may also be 9999 = same office.
bookings:
  - name: "Tenerife Jan 2027"
    pickup_office: 2
    return_office: 2
    pickup: "2027-01-10 10:00"     # YYYY-MM-DD HH:MM
    return: "2027-01-17 10:00"
    group: "A"                     # car group letter; may be left empty if model is set
    model: ""                      # optional, substring match, e.g. "Panda"
    paid_eur: 150.00               # <-- what you paid; update after rebooking
    # min_savings_eur: 5           # optional per-booking override
    # enabled: false               # optional: pause this booking
